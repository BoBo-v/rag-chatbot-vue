<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全独立沙箱网页预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: #475569; }
    button.active-toggle {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 600;
    }
    main { flex: 1; position: relative; background: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <strong>安全独立预览包装页</strong>
      <span class="badge">🔒 沙箱强隔离 · 无宿主存储访问权</span>
    </div>
    <div class="actions">
      <button id="toggle-script-btn" type="button">交互脚本: 已关闭</button>
      <button id="reload-btn" type="button">重新加载</button>
      <button id="close-btn" type="button">关闭窗口</button>
    </div>
  </header>
  <main>
    <iframe id="sandbox-frame" title="独立沙箱预览视口"></iframe>
  </main>
  <script type="module" src="/src/preview/isolated.ts"></script>
</body>
</html>
