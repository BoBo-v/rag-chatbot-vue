<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全独立沙箱网页预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: #475569; }
    button.active-toggle {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 600;
    }
    main { flex: 1; position: relative; background: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <strong>安全独立预览包装页</strong>
      <span class="badge">🔒 沙箱强隔离 · 无宿主存储访问权</span>
    </div>
    <div class="actions">
      <button id="toggle-script-btn" onclick="toggleScripts()">交互脚本: 已关闭</button>
      <button onclick="reloadPreview()">重新加载</button>
      <button onclick="window.close()">关闭窗口</button>
    </div>
  </header>
  <main>
    <iframe id="sandbox-frame"></iframe>
  </main>
  <script>
    let rawCode = '';
    let allowScripts = false;

    function buildSandboxDoc(code, scriptsEnabled) {
      const scriptPolicy = scriptsEnabled ? "script-src 'unsafe-inline';" : "script-src 'none';";
      const csp = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; connect-src 'none'; font-src data:; style-src 'unsafe-inline'; ${scriptPolicy} img-src data: blob:;">`;

      let bodyContent = code || '';
      let userHead = '';

      const headMatch = bodyContent.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
      if (headMatch) {
        userHead = headMatch[1];
        bodyContent = bodyContent.replace(/<head[^>]*>[\s\S]*?<\/head>/i, '');
      }

      userHead = userHead.replace(/<meta[^>]*http-equiv=["']?Content-Security-Policy["']?[^>]*>/gi, '');
      bodyContent = bodyContent
        .replace(/<!DOCTYPE[^>]*>/gi, '')
        .replace(/<\/?html[^>]*>/gi, '')
        .replace(/<\/?body[^>]*>/gi, '');

      return `<!DOCTYPE html><html><head><meta charset="UTF-8">${csp}${userHead}</head><body>${bodyContent}</body></html>`;
    }

    function renderCode(code, scriptsEnabled) {
      rawCode = code;
      allowScripts = scriptsEnabled;
      const iframe = document.getElementById('sandbox-frame');
      const toggleBtn = document.getElementById('toggle-script-btn');

      if (scriptsEnabled) {
        iframe.setAttribute('sandbox', 'allow-scripts');
        toggleBtn.textContent = '交互脚本: 已启用';
        toggleBtn.classList.add('active-toggle');
      } else {
        iframe.setAttribute('sandbox', '');
        toggleBtn.textContent = '交互脚本: 已关闭';
        toggleBtn.classList.remove('active-toggle');
      }

      iframe.srcdoc = buildSandboxDoc(code, scriptsEnabled);
    }

    function toggleScripts() {
      renderCode(rawCode, !allowScripts);
    }

    function reloadPreview() {
      if (rawCode) renderCode(rawCode, allowScripts);
    }

    // 从 URL hash 中解析一次性随机令牌，并从 localStorage 读取
    try {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const token = hashParams.get('token');
      let payload = null;

      if (token) {
        const stored = localStorage.getItem(token);
        if (stored) {
          try {
            payload = JSON.parse(stored);
          } catch(e) {}
          // 阅后即焚：消费后立即销毁
          localStorage.removeItem(token);
        }
      }

      // 清理超过 10 分钟未被消费的陈旧预览标记
      const now = Date.now();
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('prev_')) {
          try {
            const item = JSON.parse(localStorage.getItem(key) || '{}');
            if (item.timestamp && now - item.timestamp > 600_000) {
              localStorage.removeItem(key);
            }
          } catch(e) {}
        }
      }

      if (payload && typeof payload.code === 'string') {
        renderCode(payload.code, payload.allowScripts === true);
      } else {
        renderCode('<div style="font-family:sans-serif;padding:24px;color:#64748b;">未检测到有效的一次性预览源码凭证，请返回主页面重新点击“新标签页打开”。</div>', false);
      }
    } catch (e) {
      console.error('无法读取预览代码', e);
      renderCode('<div style="font-family:sans-serif;padding:24px;color:#ef4444;">预览数据读取失败。</div>', false);
    }
  </script>
</body>
</html>
